[project]
name = "clauthing-plugin-sdk"
version = "0.1.0"
description = "SDK for writing clauthing plugins (import name: clauthing_plugin)"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clauthing_plugin"]
